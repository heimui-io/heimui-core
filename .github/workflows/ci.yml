name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A private repo bills Actions minutes, and this repo is pushed to often. Cancelling the run a
# new push supersedes is what actually saves them: without it, five pushes in a row pay for five
# full builds and only the last one's result was ever going to matter.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default token is far broader than this build needs. Nothing here writes to the repository:
# it compiles, tests and uploads a report artifact.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Docs-only commits do not change what the tests cover.
    if: >-
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'docs:')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # `gradle-wrapper.jar` is a binary committed to the repository that every build executes
      # before any other check runs, which makes it the most valuable thing in here to tamper with.
      # This compares it against the checksums Gradle publishes.
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.4

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Tests
        run: ./gradlew allTests --stacktrace

      # The one that protects consumers rather than us: a signature change that reaches a release
      # breaks apps we cannot fix. `apiDump` has to be committed deliberately, which is the point.
      - name: Binary compatibility
        run: ./gradlew apiCheck --stacktrace

      # The keep rules only protect anybody if they are actually inside the AAR, and AGP drops them
      # silently when `consumerKeepRules.publish` is off -- which is how the SDK shipped for weeks
      # telling consumers it covered them while the artifact carried no `proguard.txt` at all. So
      # the build file is not trusted here; the artifact is opened and read.
      - name: R8 keep rules reach consumers
        run: ./scripts/check-consumer-rules.sh

      # A badge is a claim read by someone deciding whether this fits their project, and it is
      # hand-written, so it drifts the first time a dependency moves. The Compose badge said 1.11.1
      # while the build had been on 1.12.0 from the start.
      - name: README badges match the build
        run: ./scripts/check-readme-versions.sh

      # Every library inside the SDK travels into a customer's app under its own licence, and each of
      # those licences asks to be named. NOTICE is derived from the runtime classpath rather than
      # trusted, so a dependency added without an attribution fails here instead of in a legal review.
      - name: Third-party attributions are complete
        run: ./scripts/check-notice.sh

      - name: Schema is valid JSON
        run: python3 -c "import json; json.load(open('schema/heimui-screen.schema.json'))"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: shared/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
