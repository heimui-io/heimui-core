name: Scorecard

# OpenSSF Scorecard grades the repository rather than the code: whether releases are pinned, whether
# branches are protected, whether dangerous workflow patterns are present, whether dependencies are
# updated. For an SDK that other people link into their applications, that posture is part of what
# they are trusting, and the badge is the short answer to "is this maintained safely".
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions: read-all

jobs:
  analysis:
    name: Analyse repository
    runs-on: ubuntu-latest
    permissions:
      # Results are uploaded as code-scanning alerts, so they appear next to CodeQL's rather than
      # only inside a log nobody opens.
      security-events: write
      # Required to publish the score so the badge can read it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
