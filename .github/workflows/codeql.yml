name: CodeQL

# Static analysis of the SDK's own source. This repository is public and the artifact it produces
# runs inside other people's applications, so a flaw here is a flaw shipped to every consumer --
# which is a different risk from a flaw in a service you can patch and redeploy yourself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Findings arrive when a query is added, not only when code changes, so a repository that is
    # quiet for a month still needs to be looked at.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyse Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No cache restore here on purpose. CodeQL builds its database by watching a compiler run, so
      # a build that Gradle short-circuits as UP-TO-DATE produces an empty database and fails with
      # "didn't build any of it". Dependencies are still downloaded; only task outputs are not
      # reused.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Only the Android compilation. CodeQL needs a real compile to see Kotlin, but `build` would
      # also link the iOS frameworks -- tens of minutes of Kotlin/Native work that produces nothing
      # CodeQL can read, since its extractor understands JVM bytecode.
      - name: Compile
        # Every flag here exists because CodeQL has to see the compilation happen:
        #   --no-daemon, in-process        Kotlin normally compiles in a separate daemon process
        #                                  that the tracer never observes.
        #   --rerun-tasks, --no-build-cache  nothing may be skipped as already done.
        #   --no-configuration-cache       it is incompatible with --rerun-tasks.
        # Only the Android compilation: `build` would also link the iOS frameworks, tens of minutes
        # of Kotlin/Native work producing nothing CodeQL's JVM extractor can read.
        run: |
          ./gradlew :shared:compileAndroidMain             --no-daemon --rerun-tasks --no-build-cache --no-configuration-cache             -Dkotlin.compiler.execution.strategy=in-process             --stacktrace

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
