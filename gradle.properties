#Kotlin
kotlin.code.style=official
# 6 GB because linking the iOS release frameworks needs it. Kotlin/Native's whole-programme
# optimisation runs in this daemon, and at 3 GB it spent 23 minutes before dying of an
# OutOfMemoryError in StaticInitializersOptimization -- so `assemble` could not finish and nobody
# noticed, because CI only runs `allTests` and `apiCheck` and neither links a release framework.
# Measured: 3 GB fails, 6 GB links both targets from scratch in about 3m30s.
kotlin.daemon.jvmargs=-Xmx6g

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37,37.0